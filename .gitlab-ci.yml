stages:
  - lint
  - test

default:
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

lint:
  stage: lint
  script:
    - pip install --no-cache-dir ruff
    - ruff check .

test:
  stage: test
  script:
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
